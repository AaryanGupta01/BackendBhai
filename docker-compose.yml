# BackendBhai — Docker Compose
#
# ⚠️  SCAFFOLD ONLY — This file defines the intended service topology.
#     Implementation details (build contexts, environment variables, health checks)
#     will be added as each workstream implements their services.
#
# Architecture:
#   React SPA → REST + WebSocket → DevTools Server (Fastify) → PostgreSQL
#                                           ↑
#   OTel Collector → OTLP HTTP → DevTools Server
#                                           ↑
#   Simulated Backend → OTLP → OTel Collector
#

services:
  # ─────────────────────────────────────────────
  # Infrastructure Services
  # ─────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: devtools
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # TODO: Mount init scripts for devtools and ecommerce databases
      # - ./infrastructure/db/devtools:/docker-entrypoint-initdb.d/devtools
      # - ./infrastructure/db/ecommerce:/docker-entrypoint-initdb.d/ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d devtools"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Telemetry Layer
  # ─────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    # TODO: Mount collector configuration
    # volumes:
    #   - ./infrastructure/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # DevTools Core (Workstream 2)
  # ─────────────────────────────────────────────

  devtools-core:
    # TODO: Build from apps/devtools-core/
    # build: ./apps/devtools-core
    image: node:20-alpine
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: postgresql://app:secret@postgres:5432/devtools
      REDIS_URL: redis://redis:6379
      OTEL_COLLECTOR_URL: http://otel-collector:4317
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # TODO: Add command to start the Fastify server
    # command: ["node", "dist/index.js"]

  # ─────────────────────────────────────────────
  # DevTools UI (Workstream 3)
  # Served as static files by devtools-core in production
  # Separate dev server for development
  # ─────────────────────────────────────────────

  devtools-ui:
    # TODO: Build from apps/devtools-ui/
    # build: ./apps/devtools-ui
    image: node:20-alpine
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4001
      VITE_WS_URL: ws://localhost:4001/ws
    depends_on:
      - devtools-core
    # TODO: Add command to start Vite dev server
    # command: ["pnpm", "dev"]

  # ─────────────────────────────────────────────
  # Simulated Backend (Workstream 4)
  # ─────────────────────────────────────────────

  api-gateway:
    # TODO: Build from apps/demo-store/api-gateway/
    # build: ./apps/demo-store/api-gateway
    image: node:20-alpine
    ports:
      - "3000:3000"
    environment:
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: http://auth-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      OTEL_COLLECTOR_URL: http://otel-collector:4317
    depends_on:
      - auth-service
      - order-service
      - otel-collector
    # TODO: Add command
    # command: ["node", "dist/index.js"]

  auth-service:
    # TODO: Build from apps/demo-store/auth-service/
    # build: ./apps/demo-store/auth-service
    image: node:20-alpine
    ports:
      - "3001:3001"
    environment:
      SERVICE_NAME: auth-service
      OTEL_COLLECTOR_URL: http://otel-collector:4317
    depends_on:
      - otel-collector
    # TODO: Add command
    # command: ["node", "dist/index.js"]

  order-service:
    # TODO: Build from apps/demo-store/order-service/
    # build: ./apps/demo-store/order-service
    image: node:20-alpine
    ports:
      - "3002:3002"
    environment:
      SERVICE_NAME: order-service
      DATABASE_URL: postgresql://app:secret@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      PAYMENT_SERVICE_URL: http://payment-service:3003
      OTEL_COLLECTOR_URL: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-service:
        condition: service_started
      otel-collector:
        condition: service_started
    # TODO: Add command
    # command: ["node", "dist/index.js"]

  payment-service:
    # TODO: Build from apps/demo-store/payment-service/
    # build: ./apps/demo-store/payment-service
    image: node:20-alpine
    ports:
      - "3003:3003"
    environment:
      SERVICE_NAME: payment-service
      MOCK_PAYMENT_URL: http://mock-payment-api:4000
      OTEL_COLLECTOR_URL: http://otel-collector:4317
    depends_on:
      mock-payment-api:
        condition: service_started
      otel-collector:
        condition: service_started
    # TODO: Add command
    # command: ["node", "dist/index.js"]

  mock-payment-api:
    # TODO: Replace with WireMock or custom Express server
    # build: ./apps/demo-store/mock-payment-api
    image: node:20-alpine
    ports:
      - "4000:4000"
    environment:
      SERVICE_NAME: mock-payment-api
      OTEL_COLLECTOR_URL: http://otel-collector:4317
    depends_on:
      - otel-collector
    # TODO: Add command
    # command: ["node", "dist/index.js"]

  # ─────────────────────────────────────────────
  # Simulated E-Commerce Frontend (optional)
  # ─────────────────────────────────────────────

  demo-frontend:
    # TODO: Build from apps/demo-store/frontend/
    # build: ./apps/demo-store/frontend
    image: node:20-alpine
    ports:
      - "4002:4002"
    environment:
      API_GATEWAY_URL: http://localhost:3000
    depends_on:
      - api-gateway
    # TODO: Add command
    # command: ["node", "dist/index.js"]

volumes:
  postgres_data:

# ─────────────────────────────────────────────
# Network Topology (for reference)
# ─────────────────────────────────────────────
#
# React SPA (:5173 or served by devtools-core :4001)
#     ↓ REST + WebSocket
# DevTools Server (:4001)
#     ↓ SQL
# PostgreSQL (:5432) — databases: devtools, ecommerce
#
# OTel Collector (:4317 gRPC, :4318 HTTP)
#     ↓ OTLP HTTP
# DevTools Server (:4001)
#
# API Gateway (:3000)
#     → Auth Service (:3001)
#     → Order Service (:3002) → PostgreSQL, Redis
#     → Payment Service (:3003) → Mock Payment API (:4000)
#
# All services → OTel Collector (:4317) via OTLP gRPC
