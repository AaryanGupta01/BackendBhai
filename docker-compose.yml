# BackendBhai — Docker Compose
# Source: dev1.md §6.8, dev2.md, dev4.md §6.2
# Author: Dev 5 (Abhinav) — refined from scaffold with real service blocks
#
# Architecture:
#   React SPA → REST + WebSocket → DevTools Server (Fastify) → PostgreSQL
#                                           ↑
#   OTel Collector → OTLP HTTP → DevTools Server
#                                           ↑
#   Simulated Backend → OTLP gRPC → OTel Collector

services:
  # ─────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/devtools/001_initial.sql:/docker-entrypoint-initdb.d/01-devtools.sql
      - ./db/ecommerce/001_initial.sql:/docker-entrypoint-initdb.d/02-ecommerce.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Telemetry Layer
  # ─────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"   # OTLP gRPC receiver (from simulated services)
      - "4318:4318"   # OTLP HTTP receiver
    volumes:
      - ./infrastructure/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # DevTools Core (Workstream 2)
  # ─────────────────────────────────────────────

  devtools-core:
    build:
      context: .
      dockerfile: apps/devtools-core/Dockerfile
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: postgresql://app:secret@postgres:5432/devtools
      REDIS_URL: redis://redis:6379
      OTEL_COLLECTOR_URL: http://otel-collector:4317
      SIMULATED_BACKEND_URL: http://api-gateway:3000
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ─────────────────────────────────────────────
  # Simulated Backend (Workstream 1 + 4)
  # ─────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: http://auth-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - auth-service
      - order-service
      - otel-collector

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      SERVICE_NAME: order-service
      DATABASE_URL: postgresql://app:secret@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      PAYMENT_SERVICE_URL: http://payment-service:3003
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-service:
        condition: service_started
      otel-collector:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      SERVICE_NAME: payment-service
      MOCK_PAYMENT_API_URL: http://mock-payment-api:4000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      mock-payment-api:
        condition: service_started
      otel-collector:
        condition: service_started

  mock-payment-api:
    image: wiremock/wiremock:3x
    ports:
      - "4000:8080"
    volumes:
      - ./mocks/payment-api:/home/wiremock
    command: ["--global-response-templating"]

  # ─────────────────────────────────────────────
  # E-Commerce Demo Frontend (Workstream 4)
  # ─────────────────────────────────────────────

  demo-frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports:
      - "4002:4002"
    environment:
      API_GATEWAY_URL: http://localhost:3000
    depends_on:
      - api-gateway

volumes:
  postgres_data:

# ─────────────────────────────────────────────
# Port Map
# ─────────────────────────────────────────────
# 4001 — DevTools UI + API (single port, dev2 serves React at /)
# 4002 — E-commerce demo frontend (dev4)
# 3000 — API Gateway (dev1)
# 3001 — Auth Service (dev1)
# 3002 — Order Service (dev1)
# 3003 — Payment Service (dev1)
# 4000 — Mock Payment API / WireMock (dev4)
# 5432 — PostgreSQL (dev4)
# 6379 — Redis (dev4)
# 4317 — OTel Collector gRPC (dev1/infrastructure)
