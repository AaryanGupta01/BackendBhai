# BackendBhai — the monitoring platform.
#
# This file contains ONLY the platform. It monitors products; it does not contain
# any. A product connects by pointing its OpenTelemetry exporter at the collector
# below, in any language, running anywhere that can reach this host.
#
#   Platform only:      docker compose up -d
#   Platform + demo:    docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d

services:
  # ─────────────────────────────────────────────
  # Telemetry storage
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: backendbhai-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: devtools
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sh:/docker-entrypoint-initdb.d/000_init_databases.sh
      - ./infrastructure/db/devtools:/docker-entrypoint-initdb.d/devtools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d devtools"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Ingest — the platform's connection point.
  # Any product that speaks OTLP can report here.
  # ─────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: backendbhai-otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./infrastructure/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Platform server + UI (single port, D-13)
  # ─────────────────────────────────────────────
  devtools-core:
    build:
      context: .
      dockerfile: apps/devtools-core/Dockerfile
    container_name: backendbhai-devtools-core
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: postgresql://app:secret@postgres:5432/devtools
      PORT: 4001
      NODE_ENV: development
      # Advertised to the UI so an operator can see where to send telemetry.
      PUBLIC_OTLP_HTTP_URL: http://localhost:4318
      PUBLIC_OTLP_GRPC_URL: http://localhost:4317
      # Active probing may send traffic to a monitored product. Off by default;
      # mutating verbs additionally require an explicit per-request opt-in.
      ALLOW_MUTATING_PROBES: "false"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres_data:
